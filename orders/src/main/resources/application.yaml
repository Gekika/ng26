spring:
  application:
    name: orders
  datasource:
    url: ${NG_POSTGRES_URL}
    username: ${NG_POSTGRES_USER}
    password: ${NG_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: orders
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  jwt:
    secret: msHl1TEws2dToyaKpfgJJPjp/akPptoW45SPQNnV+z2XH+oGZsKqr+ahd3ajp68H
    issuer: gekika-authentication
  cart:
    base-url: ${CART_URL:http://localhost:8082}
  catalog:
    base-url: ${CATALOG_URL:http://localhost:8081}
  events:
    exchange: ng26.orders
    order-placed-routing-key: order.placed

server:
  port: 8083