# OTel Collector pipeline: receive OTLP from services, export traces to Jaeger.
# The collector is the central hub — add metrics/logs exporters here later
# without touching any service.

receivers:
  # Accept telemetry over OTLP, both gRPC (4317) and HTTP (4318).
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch spans before export — more efficient, standard practice.
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Send traces to Jaeger via OTLP (Jaeger accepts OTLP on 4317 natively).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true          # internal docker network, no TLS needed
  # Also print to the collector's own logs, so you can see spans arriving.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
  # When we add metrics/logs later, they get their own pipelines here:
  #   metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
  #   logs:    { receivers: [otlp], processors: [batch], exporters: [loki] }