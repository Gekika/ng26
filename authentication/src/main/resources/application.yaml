spring:
  application:
    name: authentication

  datasource:
    url: ${NG_POSTGRES_URL}
    username: ${NG_POSTGRES_USER}
    password: ${NG_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      schema: authentication

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: authentication

